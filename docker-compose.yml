services:
  fb-cronjob:
    build: .
    image: fb-cronjob:latest
    container_name: fb-cronjob
    ports:
      # bind เฉพาะ loopback — แอปไม่มีระบบ login
      - "127.0.0.1:3003:3003"
    environment:
      - HOST=0.0.0.0
      - PORT=3003
      - TZ=Asia/Bangkok
      # เปิดโพสต์จริง: ตั้ง DRY_RUN=false
      # - DRY_RUN=false
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
